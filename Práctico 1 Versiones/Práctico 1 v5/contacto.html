<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Contacto</title>
  <link rel="stylesheet" href="css/stylesContacto.css">
</head>

<body>
  <header>
    <div class="encabezado">
      <a href="index.html">
        <img class="logo" src="./img/logoweb.jpg" alt="logo de la web">
      </a>
      <h1 class="titulo">Bienvenido a la sección de Contacto</h1>
    </div>
    <hr>
  </header>

  <p class="subtitulo"> Complete el siguiente formulario...</p>


  <div>
    <section class="contacto">
      <ul>
        <li style="list-style-type: none">Nombre</li>
        <input type="text" name="search" id="search" placeholder="Ingrese su nombre...">
        <li style="list-style-type: none">Email</li>
        <input type="text" name="search" id="search" placeholder="Ingrese su email...">
        <li style="list-style-type: none">Teléfono</li>
        <input type="text" name="search" id="search" placeholder="Ingrese su telefono...">
        <li style="list-style-type: none">Comentarios</li>
        <input class="comentarios" type="text" name="search" id="search" placeholder="Ingrese su comentario...">
        <div class="botonescontainer">
          <button class="botones" type="submit">Enviar</button>
          <button class="botones" type="submit">Reset</button>
        </div>
      </ul>
    </section>
  </div>


  <br><br>
  <a class="botonhome" href="index.html">Volver al Home</a>

</body>

</html>
